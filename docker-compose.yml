services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: research_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fastapi-server
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/research_radar
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./react-client
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: