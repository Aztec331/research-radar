name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: fastapi-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python compilation
        working-directory: fastapi-server
        run: python -m compileall app scripts

      - name: Test model imports
        working-directory: fastapi-server
        run: python tests/test_models.py

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: react-client
        run: npm ci

      - name: Build frontend
        working-directory: react-client
        run: npm run build